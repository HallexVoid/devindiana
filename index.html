<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Devoluções e Garantias | Indiana Peças</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            /* Fundo dinâmico e suave com as cores da marca */
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 50%, #bcccdc 100%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-container {
            width: 100%;
            max-width: 900px;
        }
        
        .header-title {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header-title h1 {
            color: #102a43;
            font-weight: 700;
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .header-title p {
            color: #486581;
            font-size: 16px;
            font-weight: 400;
        }

        .iframe-wrapper {
            /* Sem fundo: o vidro (glassmorphism) virá do CSS embutido no Octadesk */
            background: transparent;
            width: 100%;
            height: 1200px; /* Ajuste conforme a altura que o form precisa */
            border-radius: 24px;
            overflow: hidden;
        }

        iframe {
            display: block;
            border-radius: 24px;
        }
        
        @media (max-width: 768px) {
            body { padding: 30px 10px; }
            .header-title h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header-title">
            <h1>Devoluções e Garantias</h1>
            <p>Preencha o formulário abaixo para iniciar sua solicitação</p>
        </div>

        <div class="iframe-wrapper">
            <!-- Iframe fornecido pelo Octadesk (verifique se já está com o jsDelivr na string de estilo!) -->
            <iframe width="100%" height="100%" frameborder="0" src="https://o136604-b1f.octadesk.com/custom-form/bcbf0594-e94f-4a49-9b67-46a6ad8f1051?linkStyle=https%3A%2F%2Fcdn.jsdelivr.net%2Fgh%2FHallexVoid%2Fdevindiana%40main%2Festilo.css"></iframe>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Devoluções e Garantias | Indiana Peças</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            /* Fundo Escuro Mesh Gradient Premium para realçar o Glassmorphism */
            background-color: #0b1a2e;
            background-image:
                radial-gradient(at 0% 0%, rgba(24, 99, 220, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(12, 66, 158, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(27, 218, 206, 0.2) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(68, 51, 169, 0.4) 0px, transparent 50%);
            background-size: 150% 150%;
            animation: gradientMove 20s ease-in-out infinite alternate;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 100%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        .page-container {
            width: 100%;
            max-width: 1050px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title h1 {
            color: #ffffff;
            font-weight: 700;
            font-size: 34px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-title p {
            color: #cdd6df;
            font-size: 17px;
            font-weight: 400;
        }

        .iframe-wrapper {
            background: transparent;
            width: 100%;
            height: 1450px;
            /* Reduzido para não sobrar muito espaço no desktop */
            border-radius: 32px;
            overflow: hidden;
        }

        iframe {
            display: block;
            border-radius: 32px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .header-title h1 {
                font-size: 26px;
            }

            .iframe-wrapper {
                height: 1700px;
                /* Maior no mobile porque os campos ficam em uma coluna e empurram para baixo */
            }
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="header-title">
            <h1>Devoluções e Garantias</h1>
            <p>Preencha o formulário abaixo para iniciar sua solicitação</p>
        </div>

        <div class="iframe-wrapper">
            <!-- Iframe com permissão de transparência (MUITO IMPORTANTE) -->
            <iframe width="100%" height="100%" allowtransparency="true" frameborder="0"
                src="https://o136604-b1f.octadesk.com/custom-form/bcbf0594-e94f-4a49-9b67-46a6ad8f1051?linkStyle=https%3A%2F%2Fcdn.jsdelivr.net%2Fgh%2FHallexVoid%2Fdevindiana%40main%2Fstyle5.css"></iframe>
        </div>
    </div>
</body>

</html>
